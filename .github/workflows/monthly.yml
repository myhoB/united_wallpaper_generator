name: Daily MUFC Fixtures Check

permissions:
  contents: write
  
on:
  schedule:
    # Runs at 08:00 UTC on the 25th of every month
    - cron: '0 8 * * *'
  workflow_dispatch: {}  # allows manual "Run workflow" button for testing

jobs:
  send-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fixtures script
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py

      - name: Commit updated snapshot if changed
        run: |
          if [ -n "$(git status --porcelain last_fixtures.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_fixtures.json
            git commit -m "Update fixtures snapshot"
            git push
          else
            echo "No snapshot changes to commit."
          fi

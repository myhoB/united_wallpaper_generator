name: Generate Wallpaper

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct URL of the chosen photo'
        required: true
      box_x_pct:
        description: 'Text box left position (% of final canvas width)'
        required: true
      box_y_pct:
        description: 'Text box top position (% of final canvas height)'
        required: true
      box_w_pct:
        description: 'Text box width (% of final canvas width)'
        required: true
      box_h_pct:
        description: 'Text box height (% of final canvas height)'
        required: true
      crop_x_pct:
        description: 'Visible frame left, as % of source image width (can be negative)'
        required: true
      crop_y_pct:
        description: 'Visible frame top, as % of source image height (can be negative)'
        required: true
      crop_w_pct:
        description: 'Visible frame width, as % of source image width'
        required: true
      crop_h_pct:
        description: 'Visible frame height, as % of source image height'
        required: true
      target_width:
        description: 'Output width in pixels'
        required: true
      target_height:
        description: 'Output height in pixels'
        required: true
      month_key:
        description: 'Which fixtures to overlay'
        required: true
        default: 'this_month'
        type: choice
        options:
          - this_month
          - next_month

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Download font
        run: |
          curl -fL -o oswald.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/oswald/Oswald%5Bwght%5D.ttf"
          # Sanity check: fail the job clearly if we somehow got an HTML error page instead of a font
          file oswald.ttf | grep -qi "TrueType\|OpenType\|font" || (echo "Downloaded file is not a valid font!" && exit 1)

      - name: Generate wallpaper
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          BOX_X_PCT: ${{ inputs.box_x_pct }}
          BOX_Y_PCT: ${{ inputs.box_y_pct }}
          BOX_W_PCT: ${{ inputs.box_w_pct }}
          BOX_H_PCT: ${{ inputs.box_h_pct }}
          CROP_X_PCT: ${{ inputs.crop_x_pct }}
          CROP_Y_PCT: ${{ inputs.crop_y_pct }}
          CROP_W_PCT: ${{ inputs.crop_w_pct }}
          CROP_H_PCT: ${{ inputs.crop_h_pct }}
          TARGET_WIDTH: ${{ inputs.target_width }}
          TARGET_HEIGHT: ${{ inputs.target_height }}
          MONTH_KEY: ${{ inputs.month_key }}
        run: python generate_wallpaper.py

      - name: Commit generated wallpaper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/output/
          git commit -m "Generate wallpaper" || echo "Nothing to commit"
          git push

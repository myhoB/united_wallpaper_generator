<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUFC Wallpaper Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #8b949e;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: #161b22;
    border: 2px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .card:hover {
    border-color: #58a6ff;
  }
  .card.selected {
    border-color: #3fb950;
  }
  .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
    background: #21262d;
  }
  .card-info {
    padding: 8px 10px;
    font-size: 12px;
    color: #8b949e;
  }
  .card-info .source {
    color: #e6edf3;
    font-weight: 600;
  }
  .badges {
    display: flex;
    gap: 4px;
    margin-top: 6px;
  }
  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .badge.ok {
    background: rgba(63, 185, 80, 0.2);
    color: #3fb950;
    border: 1px solid rgba(63, 185, 80, 0.4);
  }
  .badge.no {
    background: rgba(139, 148, 158, 0.15);
    color: #6e7681;
    border: 1px solid rgba(139, 148, 158, 0.25);
  }
  .status {
    color: #8b949e;
    padding: 40px 0;
    text-align: center;
  }
  .error {
    color: #f85149;
  }

  #placement-view {
    display: none;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }
  button {
    background: #21262d;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover {
    border-color: #58a6ff;
  }
  button.primary {
    background: #238636;
    border-color: #2ea043;
  }
  button.primary:hover {
    background: #2ea043;
  }
  #image-wrapper {
    position: relative;
    display: inline-block;
    max-width: 100%;
    line-height: 0;
    user-select: none;
    touch-action: none;
  }
  #image-wrapper img {
    display: block;
    width: 100%;
    max-height: 75vh;
    object-fit: contain;
    background: #000;
  }
  #placement-box {
    position: absolute;
    border: 1px dashed #58a6ff;
    background: rgba(0, 0, 0, 0.6);
    cursor: move;
    box-sizing: border-box;
  }
  #fixture-text-wrapper {
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4%;
    box-sizing: border-box;
  }
  #fixture-text {
    color: #ffffff;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    white-space: pre;
    pointer-events: none;
  }
  #placement-box .resize-handle {
    position: absolute;
    right: -7px;
    bottom: -7px;
    width: 16px;
    height: 16px;
    background: #3fb950;
    border: 2px solid #0d1117;
    border-radius: 50%;
    cursor: nwse-resize;
  }
  .month-toggle {
    display: flex;
    gap: 8px;
  }
  .month-toggle button.active {
    background: #1f6feb;
    border-color: #388bfd;
  }
  .coords-readout {
    color: #8b949e;
    font-size: 12px;
    margin-top: 10px;
  }
  #confirm-banner {
    margin-top: 16px;
    padding: 14px 16px;
    background: rgba(63, 185, 80, 0.15);
    border: 1px solid #2ea043;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    animation: flash-in 0.25s ease;
  }
  @keyframes flash-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<h1>MUFC Wallpaper Picker</h1>
<p class="subtitle">Click a photo to select it as your wallpaper base.</p>

<div id="content">
  <div class="status">Loading candidates…</div>
</div>

<div id="placement-view">
  <div class="toolbar">
    <button id="back-btn">&larr; Back to gallery</button>
    <div class="month-toggle">
      <button id="this-month-btn" class="active">This month</button>
      <button id="next-month-btn">Next month</button>
    </div>
    <button id="confirm-btn" class="primary">Confirm placement</button>
  </div>
  <div id="image-wrapper">
    <img id="placement-img" alt="Selected wallpaper candidate">
    <div id="placement-box">
      <div id="fixture-text-wrapper">
        <div id="fixture-text"></div>
      </div>
      <div class="resize-handle"></div>
    </div>
  </div>
  <div class="coords-readout" id="coords-readout"></div>
  <div id="confirm-banner" style="display:none;"></div>
</div>

<script>
// A photo "cleanly" supports a resolution if its height already meets or
// exceeds that resolution's height — otherwise hitting that target means
// upscaling, which loses quality. All three target resolutions share a
// 16:9 aspect ratio, so height alone is a reliable proxy here.
const RESOLUTIONS = [
  { label: '1080p', height: 1080 },
  { label: '1440p', height: 1440 },
  { label: '4K', height: 2160 },
];

function buildBadges(candidate) {
  const wrap = document.createElement('div');
  wrap.className = 'badges';
  const imgHeight = candidate.height || 0;

  RESOLUTIONS.forEach(res => {
    const badge = document.createElement('span');
    const supported = imgHeight >= res.height;
    badge.className = 'badge ' + (supported ? 'ok' : 'no');
    badge.textContent = (supported ? '\u2713 ' : '\u2717 ') + res.label;
    badge.title = supported
      ? `${res.label} (${res.height}px) — native quality, no upscaling needed`
      : `${res.label} (${res.height}px) — would need upscaling, lower quality`;
    wrap.appendChild(badge);
  });

  return wrap;
}

async function loadCandidates() {
  const content = document.getElementById('content');
  try {
    const res = await fetch('candidates.json?t=' + Date.now());
    if (!res.ok) throw new Error('candidates.json not found yet');
    const candidates = await res.json();

    if (!candidates.length) {
      content.innerHTML = '<div class="status">No candidates found. Run the generation workflow first.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid';

    candidates.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = i;

      const img = document.createElement('img');
      img.src = c.thumbnail_url || c.image_url;
      img.loading = 'lazy';

      const info = document.createElement('div');
      info.className = 'card-info';
      info.innerHTML = `<span class="source">${c.source || 'Unknown'}</span><br>${c.width}×${c.height}`;
      info.appendChild(buildBadges(c));

      card.appendChild(img);
      card.appendChild(info);
      card.addEventListener('click', () => selectCandidate(card, c));

      grid.appendChild(card);
    });

    content.innerHTML = '';
    content.appendChild(grid);
  } catch (err) {
    content.innerHTML = `<div class="status error">Couldn't load candidates: ${err.message}</div>`;
  }
}

let currentCandidate = null;
let fixturesData = null;
let currentMonthKey = 'this_month';
// Box position/size stored as PERCENTAGES of the image, so it stays correct
// regardless of how large the image is displayed on screen.
let box = { xPct: 62, yPct: 15, wPct: 32, hPct: 55 };

async function loadFixtures() {
  try {
    const res = await fetch('fixtures.json?t=' + Date.now());
    if (!res.ok) throw new Error('fixtures.json not found yet');
    fixturesData = await res.json();

    if (fixturesData.this_month_label) {
      document.getElementById('this-month-btn').textContent = fixturesData.this_month_label;
    }
    if (fixturesData.next_month_label) {
      document.getElementById('next-month-btn').textContent = fixturesData.next_month_label;
    }
  } catch (err) {
    console.error('Could not load fixtures.json:', err);
    fixturesData = { this_month: [], next_month: [] };
  }
}

function renderFixtureText(monthKey) {
  currentMonthKey = monthKey;
  const list = (fixturesData && fixturesData[monthKey]) || [];
  const textEl = document.getElementById('fixture-text');

  if (!list.length) {
    textEl.textContent = 'No fixtures found for this period.';
  } else {
    textEl.textContent = list
      .map(f => `${f.day_label} | ${f.competition}\n${f.home} vs. ${f.away}\ntime ${f.time_label}`)
      .join('\n\n');
  }
  fitFixtureText();
}

function setActiveMonthButton(id) {
  document.getElementById('this-month-btn').classList.remove('active');
  document.getElementById('next-month-btn').classList.remove('active');
  document.getElementById(id).classList.add('active');
}

document.getElementById('this-month-btn').addEventListener('click', () => {
  setActiveMonthButton('this-month-btn');
  renderFixtureText('this_month');
});
document.getElementById('next-month-btn').addEventListener('click', () => {
  setActiveMonthButton('next-month-btn');
  renderFixtureText('next_month');
});

function fitFixtureText() {
  const textEl = document.getElementById('fixture-text');
  const wrapperEl = document.getElementById('fixture-text-wrapper');
  if (!textEl.textContent.trim() || wrapperEl.clientWidth === 0) return;

  // Leave a small margin inside the padded wrapper rather than measuring exact
  // padding pixels — good enough for a preview tool, not pixel-perfect DTP.
  const availW = wrapperEl.clientWidth * 0.94;
  const availH = wrapperEl.clientHeight * 0.94;

  let lo = 4, hi = 300;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi + 1) / 2);
    textEl.style.fontSize = mid + 'px';
    const fits = textEl.scrollWidth <= availW && textEl.scrollHeight <= availH;
    if (fits) lo = mid; else hi = mid - 1;
  }
  textEl.style.fontSize = lo + 'px';
}

window.addEventListener('resize', () => {
  if (currentCandidate) fitFixtureText();
});

function selectCandidate(card, candidate) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  currentCandidate = candidate;

  // Reset to the default right-side placement and "this month" view each time.
  box = { xPct: 62, yPct: 15, wPct: 32, hPct: 55 };
  setActiveMonthButton('this-month-btn');

  const img = document.getElementById('placement-img');
  img.src = candidate.image_url;

  document.getElementById('content').style.display = 'none';
  document.getElementById('placement-view').style.display = 'block';
  document.getElementById('confirm-banner').style.display = 'none';

  img.onload = () => {
    updateBoxUI();
    renderFixtureText('this_month');
  };
  updateBoxUI();
}

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('placement-view').style.display = 'none';
  document.getElementById('content').style.display = 'block';
});

document.getElementById('confirm-btn').addEventListener('click', () => {
  const result = {
    image_url: currentCandidate.image_url,
    source: currentCandidate.source,
    placement: {
      x_pct: Math.round(box.xPct * 10) / 10,
      y_pct: Math.round(box.yPct * 10) / 10,
      width_pct: Math.round(box.wPct * 10) / 10,
      height_pct: Math.round(box.hPct * 10) / 10,
    },
  };
  console.log('Confirmed selection:', result);

  const banner = document.getElementById('confirm-banner');
  banner.style.display = 'none';
  // Force reflow so the flash-in animation replays on repeated clicks
  void banner.offsetWidth;
  banner.innerHTML =
    `<strong>&#10003; Confirmed</strong> — image from <em>${result.source || 'unknown source'}</em>, ` +
    `placement box at x=${result.placement.x_pct}% y=${result.placement.y_pct}% ` +
    `(${result.placement.width_pct}% &times; ${result.placement.height_pct}%).<br>` +
    `Full details logged to the browser console (press F12, then check the Console tab). ` +
    `The next build step will wire this button to actually generate the wallpaper.`;
  banner.style.display = 'block';
});

function updateBoxUI() {
  const boxEl = document.getElementById('placement-box');
  boxEl.style.left = box.xPct + '%';
  boxEl.style.top = box.yPct + '%';
  boxEl.style.width = box.wPct + '%';
  boxEl.style.height = box.hPct + '%';
  document.getElementById('coords-readout').textContent =
    `Box: x=${box.xPct.toFixed(1)}% y=${box.yPct.toFixed(1)}% w=${box.wPct.toFixed(1)}% h=${box.hPct.toFixed(1)}%`;
}

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

// --- Drag to move ---
const boxEl = document.getElementById('placement-box');
const wrapperEl = document.getElementById('image-wrapper');
let dragState = null;

boxEl.addEventListener('pointerdown', (e) => {
  if (e.target.classList.contains('resize-handle')) return; // handled separately
  e.preventDefault();
  boxEl.setPointerCapture(e.pointerId);
  dragState = {
    startX: e.clientX,
    startY: e.clientY,
    startBox: { ...box },
    wrapperRect: wrapperEl.getBoundingClientRect(),
  };
});

boxEl.addEventListener('pointermove', (e) => {
  if (!dragState) return;
  const dxPct = ((e.clientX - dragState.startX) / dragState.wrapperRect.width) * 100;
  const dyPct = ((e.clientY - dragState.startY) / dragState.wrapperRect.height) * 100;

  box.xPct = clamp(dragState.startBox.xPct + dxPct, 0, 100 - box.wPct);
  box.yPct = clamp(dragState.startBox.yPct + dyPct, 0, 100 - box.hPct);
  updateBoxUI();
});

boxEl.addEventListener('pointerup', (e) => {
  dragState = null;
  boxEl.releasePointerCapture(e.pointerId);
});

// --- Resize via corner handle ---
const handleEl = document.querySelector('#placement-box .resize-handle');
let resizeState = null;

handleEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  e.stopPropagation();
  handleEl.setPointerCapture(e.pointerId);
  resizeState = {
    startX: e.clientX,
    startY: e.clientY,
    startBox: { ...box },
    wrapperRect: wrapperEl.getBoundingClientRect(),
  };
});

handleEl.addEventListener('pointermove', (e) => {
  if (!resizeState) return;
  const dxPct = ((e.clientX - resizeState.startX) / resizeState.wrapperRect.width) * 100;
  const dyPct = ((e.clientY - resizeState.startY) / resizeState.wrapperRect.height) * 100;

  box.wPct = clamp(resizeState.startBox.wPct + dxPct, 5, 100 - box.xPct);
  box.hPct = clamp(resizeState.startBox.hPct + dyPct, 5, 100 - box.yPct);
  updateBoxUI();
  fitFixtureText();
});

handleEl.addEventListener('pointerup', (e) => {
  resizeState = null;
  handleEl.releasePointerCapture(e.pointerId);
});

loadCandidates();
loadFixtures();
</script>

</body>
</html>

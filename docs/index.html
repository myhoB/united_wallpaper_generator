<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUFC Wallpaper Picker</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #8b949e;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: #161b22;
    border: 2px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .card:hover {
    border-color: #58a6ff;
  }
  .card.selected {
    border-color: #3fb950;
  }
  .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
    background: #21262d;
  }
  .card-info {
    padding: 8px 10px;
    font-size: 12px;
    color: #8b949e;
  }
  .card-info .source {
    color: #e6edf3;
    font-weight: 600;
  }
  .status {
    color: #8b949e;
    padding: 40px 0;
    text-align: center;
  }
  .error {
    color: #f85149;
  }
</style>
</head>
<body>

<h1>MUFC Wallpaper Picker</h1>
<p class="subtitle">Click a photo to select it as your wallpaper base.</p>

<div id="content">
  <div class="status">Loading candidates…</div>
</div>

<script>
async function loadCandidates() {
  const content = document.getElementById('content');
  try {
    const res = await fetch('candidates.json?t=' + Date.now());
    if (!res.ok) throw new Error('candidates.json not found yet');
    const candidates = await res.json();

    if (!candidates.length) {
      content.innerHTML = '<div class="status">No candidates found. Run the generation workflow first.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid';

    candidates.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = i;

      const img = document.createElement('img');
      img.src = c.thumbnail_url || c.image_url;
      img.loading = 'lazy';

      const info = document.createElement('div');
      info.className = 'card-info';
      info.innerHTML = `<span class="source">${c.source || 'Unknown'}</span><br>${c.width}×${c.height}`;

      card.appendChild(img);
      card.appendChild(info);
      card.addEventListener('click', () => selectCandidate(card, c));

      grid.appendChild(card);
    });

    content.innerHTML = '';
    content.appendChild(grid);
  } catch (err) {
    content.innerHTML = `<div class="status error">Couldn't load candidates: ${err.message}</div>`;
  }
}

function selectCandidate(card, candidate) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  console.log('Selected candidate:', candidate);
  // Next step: this is where placement adjustment will open.
}

loadCandidates();
</script>

</body>
</html>

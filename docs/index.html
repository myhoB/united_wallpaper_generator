<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUFC Wallpaper Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #161b22;
    color: #e6edf3;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #8b949e;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: #161b22;
    border: 2px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .card:hover {
    border-color: #58a6ff;
  }
  .card.selected {
    border-color: #3fb950;
  }
  .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
    background: #21262d;
  }
  .card-info {
    padding: 8px 10px;
    font-size: 12px;
    color: #8b949e;
  }
  .card-info .source {
    color: #e6edf3;
    font-weight: 600;
  }
  .badges {
    display: flex;
    gap: 4px;
    margin-top: 6px;
  }
  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .badge.ok {
    background: rgba(63, 185, 80, 0.2);
    color: #3fb950;
    border: 1px solid rgba(63, 185, 80, 0.4);
  }
  .badge.no {
    background: rgba(139, 148, 158, 0.15);
    color: #6e7681;
    border: 1px solid rgba(139, 148, 158, 0.25);
  }
  .status {
    color: #8b949e;
    padding: 40px 0;
    text-align: center;
  }
  .error {
    color: #f85149;
  }

  #placement-view {
    display: none;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }
  button {
    background: #21262d;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover {
    border-color: #58a6ff;
  }
  button.primary {
    background: #238636;
    border-color: #2ea043;
  }
  button.primary:hover {
    background: #2ea043;
  }
  #viewport-frame {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
    margin: 0 auto;
    border: 1px solid #30363d;
    border-radius: 4px;
    touch-action: none;
  }
  #crop-img {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    cursor: grab;
    user-select: none;
    -webkit-user-drag: none;
  }
  #crop-img.dragging {
    cursor: grabbing;
  }
  .zoom-row {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 960px;
    margin: 12px auto 0;
  }
  .zoom-row label {
    font-size: 12px;
    color: #8b949e;
    white-space: nowrap;
  }
  #zoom-slider {
    flex: 1;
  }
  #res-indicator {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  #res-indicator.tier-4k {
    background: rgba(63, 185, 80, 0.2);
    color: #3fb950;
  }
  #res-indicator.tier-1440p {
    background: rgba(210, 153, 34, 0.2);
    color: #d29922;
  }
  #res-indicator.tier-1080p {
    background: rgba(139, 148, 158, 0.2);
    color: #8b949e;
  }
  #placement-box {
    position: absolute;
    border: 1px dashed #58a6ff;
    background: rgba(0, 0, 0, 0.6);
    cursor: move;
    box-sizing: border-box;
  }
  #fixture-text-wrapper {
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4%;
    box-sizing: border-box;
  }
  #fixture-text {
    color: #ffffff;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    white-space: pre;
    pointer-events: none;
  }
  #placement-box .resize-handle {
    position: absolute;
    right: -7px;
    bottom: -7px;
    width: 16px;
    height: 16px;
    background: #3fb950;
    border: 2px solid #0d1117;
    border-radius: 50%;
    cursor: nwse-resize;
  }
  .month-toggle {
    display: flex;
    gap: 8px;
  }
  .month-toggle button.active {
    background: #1f6feb;
    border-color: #388bfd;
  }
  .coords-readout {
    color: #8b949e;
    font-size: 12px;
    margin-top: 10px;
  }
  #confirm-banner, #fetch-status {
    margin-top: 16px;
    padding: 14px 16px;
    background: rgba(63, 185, 80, 0.15);
    border: 1px solid #2ea043;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    animation: flash-in 0.25s ease;
  }
  #confirm-banner.working, #fetch-status.working {
    background: rgba(88, 166, 255, 0.12);
    border-color: #388bfd;
  }
  #confirm-banner.failed, #fetch-status.failed {
    background: rgba(248, 81, 73, 0.12);
    border-color: #f85149;
  }
  @keyframes flash-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .token-bar {
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 16px;
  }
  .token-bar a {
    color: #58a6ff;
    cursor: pointer;
  }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<h1>MUFC Wallpaper Picker</h1>
<p class="subtitle">Click a photo to select it as your wallpaper base.</p>
<div class="token-bar" id="token-bar"></div>

<div class="toolbar">
  <button id="fetch-images-btn">&#8635; Fetch new images</button>
</div>
<div id="fetch-status" style="display:none;"></div>

<div id="content">
  <div class="status">Loading candidates…</div>
</div>

<div id="placement-view">
  <div class="toolbar">
    <button id="back-btn">&larr; Back to gallery</button>
    <div class="month-toggle">
      <button id="this-month-btn" class="active">This month</button>
      <button id="next-month-btn">Next month</button>
    </div>
    <button id="confirm-btn" class="primary">Confirm placement</button>
  </div>
  <div id="viewport-frame">
    <img id="crop-img" alt="Selected wallpaper candidate">
    <div id="placement-box">
      <div id="fixture-text-wrapper">
        <div id="fixture-text"></div>
      </div>
      <div class="resize-handle"></div>
    </div>
  </div>
  <div class="zoom-row">
    <label for="zoom-slider">Zoom</label>
    <input type="range" id="zoom-slider" min="0" max="1000" value="500">
    <span id="res-indicator"></span>
  </div>
  <div class="coords-readout" id="coords-readout"></div>
  <div id="confirm-banner" style="display:none;"></div>
</div>

<script>
// A photo "cleanly" supports a resolution if its height already meets or
// exceeds that resolution's height — otherwise hitting that target means
// upscaling, which loses quality. All three target resolutions share a
// 16:9 aspect ratio, so height alone is a reliable proxy here.
const RESOLUTIONS = [
  { label: '1080p', height: 1080 },
  { label: '1440p', height: 1440 },
  { label: '4K', height: 2160 },
];

function buildBadges(candidate) {
  const wrap = document.createElement('div');
  wrap.className = 'badges';
  const imgHeight = candidate.height || 0;

  RESOLUTIONS.forEach(res => {
    const badge = document.createElement('span');
    const supported = imgHeight >= res.height;
    badge.className = 'badge ' + (supported ? 'ok' : 'no');
    badge.textContent = (supported ? '\u2713 ' : '\u2717 ') + res.label;
    badge.title = supported
      ? `${res.label} (${res.height}px) — native quality, no upscaling needed`
      : `${res.label} (${res.height}px) — would need upscaling, lower quality`;
    wrap.appendChild(badge);
  });

  return wrap;
}

async function loadCandidates() {
  const content = document.getElementById('content');
  try {
    const res = await fetch('candidates.json?t=' + Date.now());
    if (!res.ok) throw new Error('candidates.json not found yet');
    const candidates = await res.json();

    if (!candidates.length) {
      content.innerHTML = '<div class="status">No candidates found. Run the generation workflow first.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid';

    candidates.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = i;

      const img = document.createElement('img');
      img.src = c.thumbnail_url || c.image_url;
      img.loading = 'lazy';

      const info = document.createElement('div');
      info.className = 'card-info';
      info.innerHTML = `<span class="source">${c.source || 'Unknown'}</span><br>${c.width}×${c.height}`;
      info.appendChild(buildBadges(c));

      card.appendChild(img);
      card.appendChild(info);
      card.addEventListener('click', () => selectCandidate(card, c));

      grid.appendChild(card);
    });

    content.innerHTML = '';
    content.appendChild(grid);
  } catch (err) {
    content.innerHTML = `<div class="status error">Couldn't load candidates: ${err.message}</div>`;
  }
}

let currentCandidate = null;
let fixturesData = null;
let currentMonthKey = 'this_month';
// Box position/size stored as PERCENTAGES of the image, so it stays correct
// regardless of how large the image is displayed on screen.
let box = { xPct: 62, yPct: 15, wPct: 32, hPct: 55 };

async function loadFixtures() {
  try {
    const res = await fetch('fixtures.json?t=' + Date.now());
    if (!res.ok) throw new Error('fixtures.json not found yet');
    fixturesData = await res.json();

    if (fixturesData.this_month_label) {
      document.getElementById('this-month-btn').textContent = fixturesData.this_month_label;
    }
    if (fixturesData.next_month_label) {
      document.getElementById('next-month-btn').textContent = fixturesData.next_month_label;
    }
  } catch (err) {
    console.error('Could not load fixtures.json:', err);
    fixturesData = { this_month: [], next_month: [] };
  }
}

function renderFixtureText(monthKey) {
  currentMonthKey = monthKey;
  const list = (fixturesData && fixturesData[monthKey]) || [];
  const textEl = document.getElementById('fixture-text');

  if (!list.length) {
    textEl.textContent = 'No fixtures found for this period.';
  } else {
    textEl.textContent = list
      .map(f => `${f.day_label} | ${f.competition}\n${f.home} vs. ${f.away}\ntime ${f.time_label}`)
      .join('\n\n');
  }
  fitFixtureText();
}

function setActiveMonthButton(id) {
  document.getElementById('this-month-btn').classList.remove('active');
  document.getElementById('next-month-btn').classList.remove('active');
  document.getElementById(id).classList.add('active');
}

document.getElementById('this-month-btn').addEventListener('click', () => {
  setActiveMonthButton('this-month-btn');
  renderFixtureText('this_month');
});
document.getElementById('next-month-btn').addEventListener('click', () => {
  setActiveMonthButton('next-month-btn');
  renderFixtureText('next_month');
});

function fitFixtureText() {
  const textEl = document.getElementById('fixture-text');
  const wrapperEl = document.getElementById('fixture-text-wrapper');
  if (!textEl.textContent.trim() || wrapperEl.clientWidth === 0) return;

  // Leave a small margin inside the padded wrapper rather than measuring exact
  // padding pixels — good enough for a preview tool, not pixel-perfect DTP.
  const availW = wrapperEl.clientWidth * 0.94;
  const availH = wrapperEl.clientHeight * 0.94;

  let lo = 4, hi = 300;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi + 1) / 2);
    textEl.style.fontSize = mid + 'px';
    const fits = textEl.scrollWidth <= availW && textEl.scrollHeight <= availH;
    if (fits) lo = mid; else hi = mid - 1;
  }
  textEl.style.fontSize = lo + 'px';
}

// --- Crop/zoom/pan state ---
// Image is positioned within the fixed 16:9 viewport via left/top (px) + scale.
// "Cover" scale = smallest scale where the image fully covers the frame with no gaps;
// this is just the DEFAULT starting point — the user can zoom out further to
// intentionally reveal black bars, per their own choice.
let crop = { scale: 1, leftPx: 0, topPx: 0, naturalW: 0, naturalH: 0 };
const RES_TIERS = [
  { key: '4k', label: '4K', width: 3840, height: 2160 },
  { key: '1440p', label: '1440p', width: 2560, height: 1440 },
  { key: '1080p', label: '1080p', width: 1920, height: 1080 },
];

function getViewportRect() {
  return document.getElementById('viewport-frame').getBoundingClientRect();
}

function computeCoverScale() {
  const rect = getViewportRect();
  return Math.max(rect.width / crop.naturalW, rect.height / crop.naturalH);
}

function applyCropTransform() {
  const img = document.getElementById('crop-img');
  img.style.width = (crop.naturalW * crop.scale) + 'px';
  img.style.height = (crop.naturalH * crop.scale) + 'px';
  img.style.left = crop.leftPx + 'px';
  img.style.top = crop.topPx + 'px';
  updateResIndicator();
}

function updateResIndicator() {
  const rect = getViewportRect();
  // How many real source pixels currently span the frame's height at this zoom.
  const effectiveSourceHeight = rect.height / crop.scale;
  const tier = pickResolutionTier(effectiveSourceHeight);

  const el = document.getElementById('res-indicator');
  el.className = 'tier-' + tier.key;
  el.textContent = `Exporting at: ${tier.label}`;
}

function pickResolutionTier(effectiveSourceHeight) {
  for (const tier of RES_TIERS) {
    if (effectiveSourceHeight >= tier.height) return tier;
  }
  return RES_TIERS[RES_TIERS.length - 1]; // fall back to smallest tier (1080p)
}

function resetCropForCandidate() {
  const rect = getViewportRect();
  crop.scale = computeCoverScale();
  crop.leftPx = (rect.width - crop.naturalW * crop.scale) / 2;
  crop.topPx = (rect.height - crop.naturalH * crop.scale) / 2;
  document.getElementById('zoom-slider').value = 500; // midpoint = cover scale
  applyCropTransform();
}

// Zoom slider maps 0–1000 to a scale range around the cover scale, centered at 500.
function zoomSliderToScale(sliderVal) {
  const coverScale = computeCoverScale();
  const minScale = coverScale * 0.4;
  const maxScale = coverScale * 4;
  const t = sliderVal / 1000; // 0..1
  // Exponential interpolation feels more natural for zoom than linear
  return minScale * Math.pow(maxScale / minScale, t);
}

document.getElementById('zoom-slider').addEventListener('input', (e) => {
  const rect = getViewportRect();
  const centerXPct = (rect.width / 2 - crop.leftPx) / (crop.naturalW * crop.scale);
  const centerYPct = (rect.height / 2 - crop.topPx) / (crop.naturalH * crop.scale);

  crop.scale = zoomSliderToScale(Number(e.target.value));

  // Keep the same image point centered in the frame as zoom changes
  crop.leftPx = rect.width / 2 - centerXPct * crop.naturalW * crop.scale;
  crop.topPx = rect.height / 2 - centerYPct * crop.naturalH * crop.scale;
  applyCropTransform();
});

// --- Drag to pan the image within the frame ---
const cropImgEl = document.getElementById('crop-img');
let panState = null;

cropImgEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  cropImgEl.classList.add('dragging');
  cropImgEl.setPointerCapture(e.pointerId);
  panState = { startX: e.clientX, startY: e.clientY, startLeft: crop.leftPx, startTop: crop.topPx };
});

cropImgEl.addEventListener('pointermove', (e) => {
  if (!panState) return;
  crop.leftPx = panState.startLeft + (e.clientX - panState.startX);
  crop.topPx = panState.startTop + (e.clientY - panState.startY);
  applyCropTransform();
});

cropImgEl.addEventListener('pointerup', (e) => {
  panState = null;
  cropImgEl.classList.remove('dragging');
  cropImgEl.releasePointerCapture(e.pointerId);
});

window.addEventListener('resize', () => {
  if (currentCandidate) { applyCropTransform(); fitFixtureText(); }
});

function selectCandidate(card, candidate) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  currentCandidate = candidate;

  // Reset to the default right-side placement and "this month" view each time.
  box = { xPct: 62, yPct: 15, wPct: 32, hPct: 55 };
  setActiveMonthButton('this-month-btn');

  const img = document.getElementById('crop-img');
  img.src = candidate.image_url;

  document.getElementById('content').style.display = 'none';
  document.getElementById('placement-view').style.display = 'block';
  document.getElementById('confirm-banner').style.display = 'none';

  img.onload = () => {
    crop.naturalW = img.naturalWidth;
    crop.naturalH = img.naturalHeight;
    resetCropForCandidate();
    updateBoxUI();
    renderFixtureText('this_month');
  };
  updateBoxUI();
}

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('placement-view').style.display = 'none';
  document.getElementById('content').style.display = 'block';
});

// --- GitHub repo config ---
const REPO_OWNER = 'myhoB';
const REPO_NAME = 'united_wallpaper_generator';
const WORKFLOW_FILE = 'generate_wallpaper.yml';
const TOKEN_KEY = 'mufc_wallpaper_gh_token';

function getToken() {
  return localStorage.getItem(TOKEN_KEY);
}

function setToken(token) {
  localStorage.setItem(TOKEN_KEY, token.trim());
  renderTokenBar();
}

function clearToken() {
  localStorage.removeItem(TOKEN_KEY);
  renderTokenBar();
}

function renderTokenBar() {
  const bar = document.getElementById('token-bar');
  const token = getToken();
  if (token) {
    bar.innerHTML = `GitHub token set (${token.slice(0, 4)}…${token.slice(-4)}) — <a id="clear-token-link">clear</a>`;
    document.getElementById('clear-token-link').addEventListener('click', clearToken);
  } else {
    bar.innerHTML = `<a id="set-token-link">Set GitHub token</a> (needed once, to generate wallpapers — stored only in this browser, never in the repo)`;
    document.getElementById('set-token-link').addEventListener('click', promptForToken);
  }
}

function promptForToken() {
  const token = prompt(
    'Paste a GitHub fine-grained personal access token, scoped to just this repo with "Actions: Read and write" permission.\n\n' +
    'It is stored only in this browser (localStorage) and is never written into the repo.'
  );
  if (token && token.trim()) {
    setToken(token);
  }
}

renderTokenBar();

function ghHeaders(token) {
  return {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  };
}

function getExpectedFilename(monthKey) {
  const today = new Date();
  let year = today.getFullYear();
  let month = today.getMonth() + 1; // JS months are 0-indexed
  if (monthKey === 'next_month') {
    month += 1;
    if (month > 12) { month = 1; year += 1; }
  }
  const abbrs = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  return `${abbrs[month - 1]}${year}.png`;
}

function setBanner(state, html) {
  const banner = document.getElementById('confirm-banner');
  banner.className = state; // '', 'working', or 'failed'
  banner.style.display = 'none';
  void banner.offsetWidth; // restart the flash-in animation
  banner.innerHTML = html;
  banner.style.display = 'block';
}

function downloadFile(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function pollForRunId(token, workflowFile, dispatchedAt, attempts = 15) {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${workflowFile}/runs?per_page=5`;
  for (let i = 0; i < attempts; i++) {
    const res = await fetch(url, { headers: ghHeaders(token) });
    if (res.ok) {
      const data = await res.json();
      const match = (data.workflow_runs || []).find(r => new Date(r.created_at).getTime() >= dispatchedAt - 5000);
      if (match) return match.id;
    }
    await new Promise(r => setTimeout(r, 2000));
  }
  return null;
}

async function pollRunStatus(token, runId, attempts = 60) {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs/${runId}`;
  for (let i = 0; i < attempts; i++) {
    const res = await fetch(url, { headers: ghHeaders(token) });
    if (res.ok) {
      const data = await res.json();
      if (data.status === 'completed') return data.conclusion; // 'success', 'failure', etc.
    }
    await new Promise(r => setTimeout(r, 3000));
  }
  return 'timeout';
}

const CANDIDATES_WORKFLOW_FILE = 'generate_candidates.yml';

function setFetchStatus(state, html) {
  const el = document.getElementById('fetch-status');
  el.className = state; // '', 'working', or 'failed' — reuses confirm-banner's color styles
  el.style.display = 'none';
  void el.offsetWidth;
  el.innerHTML = html;
  el.style.display = 'block';
}

document.getElementById('fetch-images-btn').addEventListener('click', async () => {
  const token = getToken();
  if (!token) {
    promptForToken();
    if (!getToken()) return;
  }

  const btn = document.getElementById('fetch-images-btn');
  btn.disabled = true;
  setFetchStatus('working', `<span class="spinner"></span>Triggering image search…`);

  const dispatchedAt = Date.now();
  const dispatchRes = await fetch(
    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${CANDIDATES_WORKFLOW_FILE}/dispatches`,
    {
      method: 'POST',
      headers: { ...ghHeaders(token), 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main', inputs: {} }),
    }
  );

  if (!dispatchRes.ok) {
    const msg = dispatchRes.status === 401 || dispatchRes.status === 403
      ? 'Token was rejected — it may be invalid, expired, or missing the right permissions.'
      : `GitHub API returned ${dispatchRes.status}.`;
    setFetchStatus('failed', `<strong>&#10007; Couldn't start search.</strong> ${msg}`);
    btn.disabled = false;
    return;
  }

  setFetchStatus('working', `<span class="spinner"></span>Searching for new candidates…`);

  const runId = await pollForRunId(token, CANDIDATES_WORKFLOW_FILE, dispatchedAt);
  if (!runId) {
    setFetchStatus('failed',
      `<strong>&#10007; Triggered, but couldn't find the run.</strong> Check the ` +
      `<a href="https://github.com/${REPO_OWNER}/${REPO_NAME}/actions" target="_blank">Actions tab</a> manually.`);
    btn.disabled = false;
    return;
  }

  const conclusion = await pollRunStatus(token, runId);

  if (conclusion !== 'success') {
    setFetchStatus('failed',
      `<strong>&#10007; Search ${conclusion === 'timeout' ? 'timed out' : 'failed'}.</strong> Check the ` +
      `<a href="https://github.com/${REPO_OWNER}/${REPO_NAME}/actions/runs/${runId}" target="_blank">run log</a> for details.`);
    btn.disabled = false;
    return;
  }

  setFetchStatus('', `<strong>&#10003; Done</strong> — refreshing the gallery below.`);
  btn.disabled = false;
  loadCandidates();
});

function computeCropAndResolution() {
  const rect = getViewportRect();
  const displayedW = crop.naturalW * crop.scale;
  const displayedH = crop.naturalH * crop.scale;

  // Express what's visible in the frame as percentages of the SOURCE image's
  // own dimensions. Can be negative or exceed 100 — that represents black bars
  // (frame extends beyond the image), which the backend will pad with black,
  // matching what's shown live in the browser.
  const cropXPct = (-crop.leftPx / displayedW) * 100;
  const cropYPct = (-crop.topPx / displayedH) * 100;
  const cropWPct = (rect.width / displayedW) * 100;
  const cropHPct = (rect.height / displayedH) * 100;

  const effectiveSourceHeight = rect.height / crop.scale;
  const tier = pickResolutionTier(effectiveSourceHeight);

  return {
    crop: {
      x_pct: Math.round(cropXPct * 100) / 100,
      y_pct: Math.round(cropYPct * 100) / 100,
      w_pct: Math.round(cropWPct * 100) / 100,
      h_pct: Math.round(cropHPct * 100) / 100,
    },
    tier,
  };
}

document.getElementById('confirm-btn').addEventListener('click', async () => {
  const token = getToken();
  if (!token) {
    promptForToken();
    if (!getToken()) return; // user cancelled the prompt
  }

  const placement = {
    x_pct: Math.round(box.xPct * 10) / 10,
    y_pct: Math.round(box.yPct * 10) / 10,
    width_pct: Math.round(box.wPct * 10) / 10,
    height_pct: Math.round(box.hPct * 10) / 10,
  };
  const { crop: cropRect, tier } = computeCropAndResolution();

  setBanner('working', `<span class="spinner"></span>Triggering wallpaper generation (${tier.label})…`);

  const dispatchedAt = Date.now();
  const dispatchRes = await fetch(
    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
    {
      method: 'POST',
      headers: { ...ghHeaders(token), 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ref: 'main',
        inputs: {
          image_url: currentCandidate.image_url,
          box_x_pct: String(placement.x_pct),
          box_y_pct: String(placement.y_pct),
          box_w_pct: String(placement.width_pct),
          box_h_pct: String(placement.height_pct),
          crop_x_pct: String(cropRect.x_pct),
          crop_y_pct: String(cropRect.y_pct),
          crop_w_pct: String(cropRect.w_pct),
          crop_h_pct: String(cropRect.h_pct),
          target_width: String(tier.width),
          target_height: String(tier.height),
          month_key: currentMonthKey,
        },
      }),
    }
  );

  if (!dispatchRes.ok) {
    const msg = dispatchRes.status === 401 || dispatchRes.status === 403
      ? 'Token was rejected — it may be invalid, expired, or missing the right permissions. Click "clear" above and set a new one.'
      : `GitHub API returned ${dispatchRes.status}.`;
    setBanner('failed', `<strong>&#10007; Couldn't start generation.</strong> ${msg}`);
    return;
  }

  setBanner('working', `<span class="spinner"></span>Workflow triggered — waiting for it to start…`);

  const runId = await pollForRunId(token, WORKFLOW_FILE, dispatchedAt);
  if (!runId) {
    setBanner('failed',
      `<strong>&#10007; Triggered, but couldn't find the run.</strong> Check the ` +
      `<a href="https://github.com/${REPO_OWNER}/${REPO_NAME}/actions" target="_blank">Actions tab</a> manually.`);
    return;
  }

  setBanner('working', `<span class="spinner"></span>Generating wallpaper — this usually takes under a minute…`);

  const conclusion = await pollRunStatus(token, runId);

  if (conclusion !== 'success') {
    setBanner('failed',
      `<strong>&#10007; Generation ${conclusion === 'timeout' ? 'timed out' : 'failed'}.</strong> Check the ` +
      `<a href="https://github.com/${REPO_OWNER}/${REPO_NAME}/actions/runs/${runId}" target="_blank">run log</a> for details.`);
    return;
  }

  const filename = getExpectedFilename(currentMonthKey);
  const fileUrl = `output/${filename}?t=${Date.now()}`;

  setBanner('working', `<span class="spinner"></span>Done — starting download…`);
  downloadFile(fileUrl, filename);
  setBanner('', `<strong>&#10003; Downloaded ${filename}</strong> — check your browser's downloads.`);
});

function updateBoxUI() {
  const boxEl = document.getElementById('placement-box');
  boxEl.style.left = box.xPct + '%';
  boxEl.style.top = box.yPct + '%';
  boxEl.style.width = box.wPct + '%';
  boxEl.style.height = box.hPct + '%';
  document.getElementById('coords-readout').textContent =
    `Box: x=${box.xPct.toFixed(1)}% y=${box.yPct.toFixed(1)}% w=${box.wPct.toFixed(1)}% h=${box.hPct.toFixed(1)}%`;
}

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

// --- Drag to move ---
const boxEl = document.getElementById('placement-box');
const wrapperEl = document.getElementById('viewport-frame');
let dragState = null;

boxEl.addEventListener('pointerdown', (e) => {
  if (e.target.classList.contains('resize-handle')) return; // handled separately
  e.preventDefault();
  boxEl.setPointerCapture(e.pointerId);
  dragState = {
    startX: e.clientX,
    startY: e.clientY,
    startBox: { ...box },
    wrapperRect: wrapperEl.getBoundingClientRect(),
  };
});

boxEl.addEventListener('pointermove', (e) => {
  if (!dragState) return;
  const dxPct = ((e.clientX - dragState.startX) / dragState.wrapperRect.width) * 100;
  const dyPct = ((e.clientY - dragState.startY) / dragState.wrapperRect.height) * 100;

  box.xPct = clamp(dragState.startBox.xPct + dxPct, 0, 100 - box.wPct);
  box.yPct = clamp(dragState.startBox.yPct + dyPct, 0, 100 - box.hPct);
  updateBoxUI();
});

boxEl.addEventListener('pointerup', (e) => {
  dragState = null;
  boxEl.releasePointerCapture(e.pointerId);
});

// --- Resize via corner handle ---
const handleEl = document.querySelector('#placement-box .resize-handle');
let resizeState = null;

handleEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  e.stopPropagation();
  handleEl.setPointerCapture(e.pointerId);
  resizeState = {
    startX: e.clientX,
    startY: e.clientY,
    startBox: { ...box },
    wrapperRect: wrapperEl.getBoundingClientRect(),
  };
});

handleEl.addEventListener('pointermove', (e) => {
  if (!resizeState) return;
  const dxPct = ((e.clientX - resizeState.startX) / resizeState.wrapperRect.width) * 100;
  const dyPct = ((e.clientY - resizeState.startY) / resizeState.wrapperRect.height) * 100;

  box.wPct = clamp(resizeState.startBox.wPct + dxPct, 5, 100 - box.xPct);
  box.hPct = clamp(resizeState.startBox.hPct + dyPct, 5, 100 - box.yPct);
  updateBoxUI();
  fitFixtureText();
});

handleEl.addEventListener('pointerup', (e) => {
  resizeState = null;
  handleEl.releasePointerCapture(e.pointerId);
});

loadCandidates();
loadFixtures();
</script>
